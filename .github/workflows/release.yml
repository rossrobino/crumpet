name: Release

on:
  push:
    branches:
      - main

permissions: {}
jobs:
  release:
    if: github.repository == 'rossrobino/crumpet'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Changesets publishes with npm, and trusted publishing needs npm 11.5.1 or later
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # the example's packages are used by the Tailwind tests, which run before publishing
      - name: Install Dependencies
        run: bun install --frozen-lockfile && cd example && bun install --frozen-lockfile

      - name: Create Release Pull Request and Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun run release
        env:
          NPM_CONFIG_PROVENANCE: true
